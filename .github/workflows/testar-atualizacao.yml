# Testa, sem publicar, a atualização pequena (só os arquivos que mudaram) com uma versão de teste 9.9.9.
name: Testar atualização

on:
  push:
    branches: [main]
    paths: [".github/workflows/testar-atualizacao.yml", "installer/**", "tools/**", "build.py"]

jobs:
  atualizar:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Versão anterior (base)
        shell: pwsh
        run: ./tools/ci_base.ps1
      - name: Gerar 9.9.9 com atualização pequena
        shell: bash
        run: |
          sed -i 's/__version__ = ".*"/__version__ = "9.9.9"/' convergio/__init__.py
          python -m pip install -q -r requirements.txt pyinstaller
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup -y --no-progress; fi
          python build.py --publicar --base-dir base-anterior --base-versao "$BASE_VERSAO" > build.log 2>&1 || (tail -60 build.log; exit 1)
          grep -E "arquivo\(s\) mudaram|Atualiza" build.log | head; cat Saida/versao.json | head -30
      - name: Testar a atualização pequena
        shell: pwsh
        run: ./tools/ci_testar_patch.ps1 -Versao 9.9.9
