# Reproduz a atualização automática no Windows.
name: Testar atualização

on:
  push:
    branches: [main]
    paths: [".github/workflows/testar-atualizacao.yml", "tests/clicar_atualizar.py"]

jobs:
  clicar:
    # versão 1.0.1 instalada; clica em "Atualizar agora" (oferece a versão publicada mais recente)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Instalar 1.0.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/lohanlilson/Convergio/releases/download/v1.0.1/Convergio-Setup-1.0.1.exe" -OutFile antiga.exe
          $p = Start-Process .\antiga.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru; $p.WaitForExit()
          Start-Sleep 5; Get-Process Convergio -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Clicar em "Atualizar agora" e acompanhar
        shell: pwsh
        run: |
          python -m pip install -q pywinauto
          python tests/clicar_atualizar.py
          $key = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{3680703B-A357-4D95-B063-9D9D747F6B6F}_is1"
          Write-Host "=== Versão instalada no fim: $((Get-ItemProperty $key).DisplayVersion)"

  ajudante:
    # o ajudante de atualização com o programa fechado (fechou=sim) e ainda aberto (fechou=nao)
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        fechou: ["sim", "nao"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Gerar instalador de teste 9.9.9 (com log)
        shell: bash
        run: |
          sed -i 's/__version__ = ".*"/__version__ = "9.9.9"/' convergio/__init__.py
          python -m pip install -q -r requirements.txt pyinstaller
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup -y --no-progress; fi
          python build.py > build.log 2>&1 || (tail -40 build.log; exit 1)
      - name: Instalar 1.1.0, abrir e atualizar pelo ajudante
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/lohanlilson/Convergio/releases/download/v1.1.0/Convergio-Setup-1.1.0.exe" -OutFile antiga.exe
          $p = Start-Process .\antiga.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru; $p.WaitForExit()
          Start-Sleep 5; Get-Process Convergio -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2
          Remove-Item "$env:TEMP\Setup Log*" -ErrorAction SilentlyContinue
          $exe = "C:\Program Files\Convergio\Convergio.exe"
          $novo = (Resolve-Path "Saida\Convergio-Setup-9.9.9.exe").Path
          $app = Start-Process $exe -PassThru; Start-Sleep 8
          Start-Process $exe -ArgumentList "--run-update", "`"$novo`"", $app.Id
          if ("${{ matrix.fechou }}" -eq "sim") { Start-Sleep 2; Stop-Process -Id $app.Id -Force }
          $t = Get-Date
          while (((Get-Date) - $t).TotalSeconds -lt 200) {
            Start-Sleep 3
            $lista = Get-Process | Where-Object { $_.ProcessName -match "Convergio|is-|\.tmp" } | ForEach-Object { "$($_.ProcessName)#$($_.Id)" }
            Write-Host ("{0,4}s  {1}" -f [int]((Get-Date) - $t).TotalSeconds, ($lista -join "  "))
            if (((Get-Date) - $t).TotalSeconds -gt 75 -and -not ($lista -match "Setup|tmp")) { break }
          }
          $key = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{3680703B-A357-4D95-B063-9D9D747F6B6F}_is1"
          Write-Host "=== Versão instalada no fim: $((Get-ItemProperty $key).DisplayVersion)"
          Write-Host "--- log do instalador (fim):"
          Get-ChildItem "$env:TEMP\Setup Log*" | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 60 }
