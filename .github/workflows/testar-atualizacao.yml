# Reproduz a atualização automática no Windows: 1.0.1 instalada -> instalador 1.1.0 publicado.
name: Testar atualização

on:
  push:
    branches: [main]
    paths: [".github/workflows/testar-atualizacao.yml"]

jobs:
  par:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cenario: ["tudo-fechado", "ajudante-vivo", "programa-vivo"]
    steps:
      - name: Instalar 1.0.1 e baixar o instalador 1.1.0
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/lohanlilson/Convergio/releases/download/v1.0.1/Convergio-Setup-1.0.1.exe" -OutFile antiga.exe
          Invoke-WebRequest "https://github.com/lohanlilson/Convergio/releases/download/v1.1.0/Convergio-Setup-1.1.0.exe" -OutFile nova.exe
          $p = Start-Process .\antiga.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru; $p.WaitForExit()
          Start-Sleep 5; Get-Process Convergio -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2
      - name: Atualizar (${{ matrix.cenario }})
        shell: pwsh
        run: |
          $exe = "C:\Program Files\Convergio\Convergio.exe"
          if ("${{ matrix.cenario }}" -eq "ajudante-vivo") {
            # o ajudante (Convergio.exe --run-update) ainda aberto, esperando um processo que não fecha
            $espera = Start-Process powershell -ArgumentList "-Command","Start-Sleep 300" -PassThru
            Start-Process $exe -ArgumentList "--run-update","C:\nao-existe.exe",$espera.Id; Start-Sleep 6
          }
          if ("${{ matrix.cenario }}" -eq "programa-vivo") { Start-Process $exe; Start-Sleep 8 }
          Get-Process Convergio -ErrorAction SilentlyContinue | Format-Table Id, Path -AutoSize
          $log = "$env:TEMP\convergio-setup.log"
          $p = Start-Process .\nova.exe -ArgumentList '/SILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS',"/LOG=`"$log`"" -PassThru
          $p.WaitForExit()
          Write-Host "Código de saída do instalador: $($p.ExitCode)"
          $key = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{3680703B-A357-4D95-B063-9D9D747F6B6F}_is1"
          Write-Host "=== Versão instalada no fim: $((Get-ItemProperty $key).DisplayVersion)"
          Get-Content $log | Select-String -Pattern "rror|ollback|in use|Restart|Mutex|running|Abort|Fail|succeeded|Deleting|DeleteFile|Rolling|Message box" | Select-Object -First 60
